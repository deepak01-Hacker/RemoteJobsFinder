name: Daily remote jobs digest

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 09:00 IST
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # AI layer runs here only if you add an OPENAI_API_KEY repo secret.
      # (The Selenium/ChatGPT-website backend needs your logged-in browser,
      # so it can only run on your own computer.)
      - name: Build digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_BACKEND: ${{ secrets.OPENAI_API_KEY != '' && 'api' || 'none' }}
        run: python job_digest.py

      - name: Commit results
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add -A digests seen.json
          [ -f ai_cache.json ] && git add ai_cache.json || true
          git diff --staged --quiet || git commit -m "Digest $(date -u +%F)"
          git push
